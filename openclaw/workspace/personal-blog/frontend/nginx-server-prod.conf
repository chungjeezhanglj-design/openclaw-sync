# =============================================================================
# 博客小时光系统 · 生产级 nginx 配置
# =============================================================================
# 适用于: Synology NAS / 独立服务器
# 用法:
#   1. cp frontend/nginx-server-prod.conf /etc/nginx/sites-available/personal-blog
#   2. ln -s /etc/nginx/sites-available/personal-blog /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#
# 关键改动 vs nginx-server.conf:
#   - HTTPS (Let's Encrypt) + HSTS (强制 HTTPS)
#   - TLS 1.2/1.3 (禁用 SSLv3/TLS 1.0/1.1)
#   - 安全 headers (CSP / X-Frame-Options / X-Content-Type-Options)
#   - gzip 压缩
#   - 静态资源长期缓存 (1 年)
#   - API 请求体大小限制 + 超时
# =============================================================================

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name chungjee.familyds.org;

    # ACME challenge (Let's Encrypt 证书续期)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其他请求全部 301 重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chungjee.familyds.org;

    # ----- TLS 证书 (Let's Encrypt) -----
    ssl_certificate /etc/letsencrypt/live/chungjee.familyds.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chungjee.familyds.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/chungjee.familyds.org/chain.pem;

    # ----- TLS 配置 (Mozilla Intermediate) -----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ----- 安全 Headers -----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP — 允许 inline (Tailwind 用), 但限制外部脚本
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.tongyi.com https://*.moonshot.cn https://*.minimax.chat https://192.168.1.111:11434; frame-ancestors 'self';" always;

    # ----- gzip 压缩 -----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ----- 请求体大小 + 超时 -----
    client_max_body_size 20M;        # 上传图片最大 20MB
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 65s;

    # ----- 隐藏 nginx 版本 -----
    server_tokens off;

    # ----- 前端静态文件 -----
    root /var/services/web/blog/frontend/dist;
    index index.html;

    # 长期缓存 hashed assets (Vite 输出文件名带 hash)
    location ~* \.(js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML 不缓存 (避免部署后旧版本)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----- API 反向代理 -----
    location /api/ {
        proxy_pass http://[::1]:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # WebSocket 支持 (SSE 日志流 / 实时通知)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲 — API 响应通常较小, 关闭缓冲降低延迟
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ----- 上传文件 (代理到后端, 也可以直接 nginx serve) -----
    location /uploads/ {
        # 直接 serve 上传目录 (避开后端代理, 性能更好)
        alias /var/services/web/blog/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;

        # 禁止执行上传目录中的脚本
        location ~* \.(php|pl|py|jsp|asp|sh|cgi)$ {
            deny all;
            return 403;
        }
    }

    # ----- 健康检查 (可选) -----
    location /health/ {
        # 健康检查通常不应该被缓存
        access_log off;
        proxy_pass http://[::1]:3000;
    }

    # ----- 隐藏敏感文件 -----
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ----- 日志 -----
    access_log /var/log/nginx/personal-blog-access.log;
    error_log /var/log/nginx/personal-blog-error.log warn;
}