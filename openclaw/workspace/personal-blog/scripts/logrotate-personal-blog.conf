# =============================================================================
# 博客小时光系统 · logrotate 配置
# =============================================================================
# 用法:
#   1. 复制到 /etc/logrotate.d/personal-blog
#   2. logrotate -d /etc/logrotate.d/personal-blog  # 调试
#   3. logrotate -f /etc/logrotate.d/personal-blog  # 强制执行
#
# 默认走 daily + rotate 14 + compress — 大约保留 2 周日志
# =============================================================================

# ----- 后端应用日志 -----
# 假设日志写在 /var/log/personal-blog/ (实际路径按部署调整)
/var/log/personal-blog/*.log {
    daily                       # 每天轮转
    rotate 14                   # 保留 14 天
    missingok                   # 日志不存在不报错
    notifempty                  # 空文件不轮转
    compress                    # gzip 压缩 (rotate 后)
    delaycompress               # 上一份也压缩
    copytruncate                # 原地截断, 不重启应用 (适合 Node.js stdout 重定向)
    create 0644 root root        # 新文件权限

    # 触发时执行的脚本 — 比如发送通知
    postrotate
        # 通知 backend reload (如果是用 pm2 / systemd 管理的)
        # pm2 reload personal-blog-backend > /dev/null 2>&1 || true
        :
    endscript
}

# ----- nginx 访问日志 -----
/var/log/nginx/personal-blog-*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts               # pre/post 脚本只跑一次 (所有文件共享)
    postrotate
        # 让 nginx 重新打开日志文件
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid) > /dev/null 2>&1 || true
    endscript
}

# ----- 后端 uploads 审计日志 (如果有) -----
/var/log/personal-blog/audit.log {
    weekly                      # 每周轮转 (审计日志量小)
    rotate 52                   # 保留 1 年 (合规需要)
    missingok
    notifempty
    compress
    create 0600 root root       # 审计日志仅 root 可读
}