          schema:
            type: string
      responses:
        '200':
          description: 返回提示词详情
    put:
      tags:
        - AI 配置 AI
      summary: 更新提示词
      operationId: updatePreset
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                prompt:
                  type: string
      responses:
        '200':
          description: 更新成功
    delete:
      tags:
        - AI 配置 AI
      summary: 删除提示词
      operationId: deletePreset
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功

  /ai-prompts/presets/{id}/set-default:
    post:
      tags:
        - AI 配置 AI
      summary: 设为默认提示词
      operationId: setDefaultPreset
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 设置成功

  /ai-prompts/ai-config:
    get:
      tags:
        - AI 配置 AI
      summary: 获取 AI 配置
      operationId: getAiConfig
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 返回 AI 配置
    put:
      tags:
        - AI 配置 AI
      summary: 更新 AI 配置
      operationId: updateAiConfig
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                aiProvider:
                  type: string
                  enum: [ollama, tongyi, minimax, moonshot]
                ollamaBaseUrl:
                  type: string
                ollamaModel:
                  type: string
                customApiUrl:
                  type: string
                customApiModel:
                  type: string
      responses:
        '200':
          description: 更新成功

  /ai-prompts/ollama-models:
    get:
      tags:
        - AI 配置 AI
      summary: 获取 Ollama 模型列表
      operationId: getOllamaModels
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 返回模型列表

  # ==================== 行为追踪接口 ====================
  /behavior/track:
    post:
      tags:
        - 行为追踪 Behavior
      summary: 上报行为数据
      operationId: trackBehavior
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BehaviorTrackRequest'
      responses:
        '200':
          description: 上报成功

  /behavior/config:
    get:
      tags:
        - 行为追踪 Behavior
      summary: 获取行为配置
      operationId: getBehaviorConfig
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 返回行为配置
    put:
      tags:
        - 行为追踪 Behavior
      summary: 更新行为配置
      operationId: updateBehaviorConfig
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                gpsTolerance:
                  type: number
                trackEnabled:
                  type: boolean
      responses:
        '200':
          description: 更新成功

  /behavior/stats:
    get:
      tags:
        - 行为追踪 Behavior
      summary: 行为统计
      operationId: getBehaviorStats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 返回统计数据

  /behavior/article/{articleId}:
    get:
      tags:
        - 行为追踪 Behavior
      summary: 文章行为分析
      operationId: getArticleBehavior
      security:
        - bearerAuth: []
      parameters:
        - name: articleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 返回文章行为数据

  /behavior/user/{userId}:
    get:
      tags:
        - 行为追踪 Behavior
      summary: 用户行为分析
      operationId: getUserBehavior
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 返回用户行为数据

  # ==================== 日志接口 ====================
  /logs/operations:
    get:
      tags:
        - 日志 Logs
      summary: 获取操作日志
      operationId: getOperationLogs
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: userId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 返回操作日志列表

  /logs/clear/preview:
    get:
      tags:
        - 日志 Logs
      summary: 预览日志清理
      operationId: previewClearLogs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 返回可清理的日志数量

  /logs/clear:
    delete:
      tags:
        - 日志 Logs
      summary: 清理日志
      operationId: clearLogs
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  description: 清理多少天前的日志
      responses:
        '200':
          description: 清理成功

  /logs/convert-gps:
    post:
      tags:
        - 日志 Logs
      summary: GPS 转地名
      description: 批量将 GPS 坐标转换为地理位置名称
      operationId: convertGPSAddresses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 转换成功

  /logs/stream:
    get:
      tags:
        - 日志 Logs
      summary: 日志流（SSE）
      operationId: logStream
      security:
        - bearerAuth: []
      responses:
        '200':
          description: SSE 实时日志流

  /logs/ip-stats:
    get:
      tags:
        - 日志 Logs
      summary: IP 统计
      operationId: getIPStatsHandler
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 返回 IP 统计数据

  /logs/clear-cache:
    post:
      tags:
        - 日志 Logs
      summary: 清理缓存
      operationId: clearCacheHandler
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 清理成功

  # ==================== 监控接口 ====================
  /monitoring/health:
    get:
      tags:
        - 监控 Monitoring
      summary: 健康检查
      operationId: healthCheck
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string

  /monitoring/system/status:
    get:
      tags:
        - 监控 Monitoring
      summary: 系统状态检查
      operationId: systemStatus
      responses:
        '200':
          description: 返回系统状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'

  # ==================== 设置接口 ====================
  /setup/config:
    get:
      tags:
        - 设置 Setup
      summary: 获取设置配置
      operationId: getClientConfig
      responses:
        '200':
          description: 返回客户端配置

  /setup/configure:
    post:
      tags:
        - 设置 Setup
      summary: 执行系统设置
      description: 首次启动时配置数据库和管理员账号
      operationId: configureSystem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dbHost
                - dbDatabase
                - dbUsername
                - dbPassword
                - adminEmail
                - adminPassword
              properties:
                dbHost:
                  type: string
                dbPort:
                  type: integer
                dbDatabase:
                  type: string
                dbUsername:
                  type: string
                dbPassword:
                  type: string
                adminEmail:
                  type: string
                adminPassword:
                  type: string
      responses:
        '200':
          description: 配置成功

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Token，格式：Bearer <token>

  schemas:
    # ==================== 通用响应 ====================
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
        errors:
          type: array
          items:
            type: object

    # ==================== 认证相关 ====================
    AuthResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            token:
              type: string
            isAdmin:
              type: boolean

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        bio:
          type: string
        role:
          type: string
          enum: [user, editor, admin]
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    UserProfileResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'

    UserUpdateRequest:
      type: object
      properties:
        nickname:
          type: string
        avatar:
          type: string
        bio:
          type: string
        phone:
          type: string
        location:
          type: string
        website:
          type: string
        gender:
          type: string
        birthday:
          type: string
          format: date

    # ==================== 文章相关 ====================
    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        layoutType:
          type: string
          enum: [timeline, grid, masonry, map]
        status:
          type: string
          enum: [draft, published, archived]
        visibility:
          type: string
          enum: [public, friends, followers, private]
        viewCount:
          type: integer
        likeCount:
          type: integer
        commentCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
        user:
          $ref: '#/components/schemas/User'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

    PostListResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            posts:
              type: array
              items:
                $ref: '#/components/schemas/Post'
            pagination:
              $ref: '#/components/schemas/Pagination'

    PostDetailResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            post:
              $ref: '#/components/schemas/Post'

    PostUpdateRequest:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        layoutType:
          type: string
        status:
          type: string
        visibility:
          type: string
        tagIds:
          type: array
          items:
            type: string

    # ==================== 照片相关 ====================
    Photo:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        caption:
          type: string
        aiTitle:
          type: string
        aiTags:
          type: array
          items:
            type: string
        gpsLat:
          type: number
        gpsLng:
          type: number
        locationName:
          type: string
        takenAt:
          type: string
        deviceName:
          type: string
        deviceMake:
          type: string
        deviceModel:
          type: string
        exposureTime:
          type: string
        fNumber:
          type: number
        isoSpeed:
          type: integer
        focalLength:
          type: number

    PhotoUploadResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            photos:
              type: array
              items:
                $ref: '#/components/schemas/Photo'

    # ==================== 标签相关 ====================
    Tag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        postCount:
          type: integer

    # ==================== 评论相关 ====================
    Comment:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        createdAt:
          type: string
        pinned:
          type: boolean
        approved:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
        replies:
          type: array
          items:
            $ref: '#/components/schemas/Comment'

    # ==================== 搜索相关 ====================
    SearchIntent:
      type: object
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        location:
          type: string
        keywords:
          type: array
          items:
            type: string

    SearchIntentResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            intent:
              $ref: '#/components/schemas/SearchIntent'

    SearchResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            photos:
              type: array
              items:
                $ref: '#/components/schemas/Photo'

    # ==================== 分页 ====================
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    # ==================== 行为追踪 ====================
    BehaviorTrackRequest:
      type: object
      properties:
        eventType:
          type: string
          enum: [page_view, article_view, scroll, click, resize]
        pageUrl:
          type: string
        pageType:
          type: string
        articleId:
          type: string
        scrollDepth:
          type: number
        stayDuration:
          type: integer
        clickTarget:
          type: string
        userAgent:
          type: string
        screenResolution:
          type: string
        viewportSize:
          type: string
        gpsLat:
          type: number
        gpsLng:
          type: number

    # ==================== 系统状态 ====================
    SystemStatusResponse:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            dbConfigured:
              type: boolean
            dbConnected:
              type: boolean
            dbInitialized:
              type: boolean
            hasUsers:
              type: boolean
            setupComplete:
              type: boolean
            adminEmail:
              type: string
